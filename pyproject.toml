[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utxo-sleuth"
version = "0.1.0"
description = "Bitcoin address clustering with a confidence score and explanation for each link."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["embit>=0.8", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
utxo-sleuth = "utxo_sleuth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utxo_sleuth = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
